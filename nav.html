    <style>
        #logo {

        .login-button {
            background-color: #e60e15;
            color: #fff;
            font-size: 14px;
            padding: 8px 20px;
            border-radius: 50px;
            transition: 0.4s background-color;
        }
        
        .login-button:hover {
            background-color: #ea0d0d;
        }
        
        .navbar-toggler {
            border: none;
            font-size: 1.25rem;
        }
        
        .navbar-toggler:focus,
        .btn-close:focus {
            box-shadow: none;
            outline: none;
        }
        
        .nav-item {
            color: #666777;
            font-weight: 600;
            font-size: 19px;
        }
        
        .nav-link {
            position: relative;
        }
        
        .nav-link:hover,
        .nav-link:active {
            color: black;
        }
        
        .row a {
            text-decoration: none;
        }
        
        .g i {
            margin: 0 20px;
            float: right;
        }
        
        .or i {
            color: orange;
        }
        
        .gg i {
            font-size: 22px;
            color: white;
        }
        
        @media (min-width:991px) {
            .nav-link::before {
                content: "";
                position: absolute;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 0;
                height: 2px;
                background-color: red;
                visibility: hidden;
                transition: 0.3s ease-in-out;
            }
            .nav-link:hover::before,
            .nav-link.active::before {
                width: 100%;
                visibility: visible;
            }
        }
    </style>
</head>
